# OpenOCD configuration for CH32V103 with WCH-Link (MounRiver OpenOCD)
# Usage: openocd -f boards/wch/ch32v103evt/support/ch32v103evt.cfg

interface wch2pin
transport select wch_riscv

adapter speed 6000

set _CHIPNAME ch32v103
set _TARGETNAME $_CHIPNAME.cpu

jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x20000001

target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME

$_TARGETNAME.0 configure -work-area-phys 0x20000000 -work-area-size 0x5000 -work-area-backup 0

flash bank $_CHIPNAME.flash wch_riscv 0x08000000 0 0 0 $_TARGETNAME.0

init
reset halt
